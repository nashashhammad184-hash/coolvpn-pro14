workflows:
  android-release:
    name: Android Release Workflow
    instance_type: mac_mini_m2
    environment:
      groups:
        - android_credentials
      vars:
        PACKAGE_NAME: "com.coolvpn.pro"
        NODE_OPTIONS: "--max-old-space-size=4096"
      node: v22.14.0
    scripts:
      - name: Force Install Dependencies, Export and Build Android Release
        script: |
          set -e

          # 1. تنظيف بيئة الجذر
          rm -f /Users/builder/package.json /Users/builder/yarn.yml

          # 2. فك ضغط الأرشيف بدقة
          ZIP_NAME="coolvpn-hammad-pro-project-github-actions.zip"
          if [ -f "$ZIP_NAME" ]; then
            echo "Extracting $ZIP_NAME..."
            unzip -q "$ZIP_NAME"
          fi

          # 3. تحديد مجلد الموبايل الأساسي وتخطي api-server
          PROJECT_DIR=$(find . -name "app.json" -not -path "*/node_modules/*" -not -path "*/api-server/*" -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="coolvpn-pro-project"
          fi

          cd "$PROJECT_DIR"
          echo "Working inside project directory: $(pwd)"

          # 4. تصحيح package.json واستبدال catalog القيم بنسخ ثابتة ومستقرة
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            
            if (pkg.devDependencies) {
              for (const [k, v] of Object.entries(pkg.devDependencies)) {
                if (v === "catalog:" || (v && v.startsWith("workspace:"))) {
                  delete pkg.devDependencies[k];
                }
              }
            }
            if (pkg.dependencies) {
              for (const [k, v] of Object.entries(pkg.dependencies)) {
                if (v === "catalog:" || (v && v.startsWith("workspace:"))) {
                  delete pkg.dependencies[k];
                }
              }
            }

            // إضافة المكتبات التي كانت تسبب المشكلة بشكل صريح
            pkg.dependencies["@tanstack/react-query"] = "^5.60.0";
            pkg.dependencies["zod"] = "^3.24.0";
            pkg.devDependencies["@react-native/metro-config"] = "latest";
            
            delete pkg.workspaces;
            delete pkg.packageManager;

            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
            console.log("package.json successfully updated with explicit dependencies.");
          '

          # 5. تنظيف الذاكرة المؤقتة وملفات القفل
          rm -rf .expo node_modules yarn.lock .yarnrc.yml package-lock.json

          # 6. تثبيت الحزم عبر NPM
          npm install --legacy-peer-deps

          # 7. التأكد الإضافي من تثبيت حزمة react-query بالذات بشكل مباشر لضمان عدم ضياعها
          npm install @tanstack/react-query@5.60.0 zod@3.24.0 --legacy-peer-deps

          # 8. توليد مجلد الأندرويد الأصلي عبر Expo Prebuild
          npx expo prebuild --platform android --clean --no-install

          # 9. تصدير الـ JS Bundle يدوياً
          echo "Exporting production JS bundle manually..."
          mkdir -p android/app/src/main/assets android/app/src/main/res
          npx expo export --platform android --dev false --output-dir dist-export
          
          if [ -f "dist-export/_expo/static/js/android/index-*.js" ]; then
            cp dist-export/_expo/static/js/android/index-*.js android/app/src/main/assets/index.android.bundle
          elif [ -f "dist-export/index.android.bundle" ]; then
            cp dist-export/index.android.bundle android/app/src/main/assets/index.android.bundle
          else
            npx react-native bundle --platform android --dev false --entry-file node_modules/expo-router/entry.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res
          fi

          # 10. بناء ملفات الـ Release عبر Gradle
          cd android
          echo "Current Android build path: $(pwd)"
          chmod +x gradlew

          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8" >> gradle.properties

          ./gradlew clean
          ./gradlew assembleRelease bundleRelease --no-daemon -x bundleReleaseJsAndAssets
    artifacts:
      - "**/android/app/build/outputs/apk/release/*.apk"
      - "**/android/app/build/outputs/bundle/release/*.aab"
