workflows:
  react-native-android:
    name: React Native Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: 20
    triggering:
      events:
        - push
    scripts:
      - name: Extract Project ZIP
        script: |
          # فك ضغط الملف المضغوط إلى مجلد فرعي نظيف
          unzip "*.zip"
          ls -la
      - name: Install dependencies
        script: |
          # العثور على اسم المجلد المستخرج تلقائياً
          TARGET_DIR=$(find . -maxdepth 1 -type d ! -name "." ! -name ".*" | head -n 1)
          
          # حل مشكلة Yarn: إنشاء ملف مستقل فارغ في المجلد الخارجي لمنع التعارض
          touch ../yarn.lock
          
          # الدخول لمجلد مشروعك وتفعيل التثبيت
          cd "$TARGET_DIR"
          corepack enable
          yarn install
      - name: Build Android APK and AAB
        script: |
          TARGET_DIR=$(find . -maxdepth 1 -type d ! -name "." ! -name ".*" | head -n 1)
          cd "$TARGET_DIR/android" && ./gradlew assembleRelease bundleRelease
    artifacts:
      - "**/build/outputs/apk/release/*.apk"
      - "**/build/outputs/bundle/release/*.aab"
