workflows:
  android-release:
    name: Android Release Workflow
    instance_type: mac_mini_m2
    environment:
      groups:
        - android_credentials
      vars:
        PACKAGE_NAME: "com.coolvpn.pro"
        NODE_OPTIONS: "--max-old-space-size=4096"
      node: v22.14.0
      java: 17
    scripts:
      - name: Clean, Install, Prebuild and Build Android Release with Debug Info
        script: |
          set -e

          # 1. تكوين بيئة جافا 17
          if [ -d "/Library/Java/JavaVirtualMachines/temurin-17.jdk/Contents/Home" ]; then
            export JAVA_HOME="/Library/Java/JavaVirtualMachines/temurin-17.jdk/Contents/Home"
          elif [ -d "/Applications/Android Studio.app/Contents/jbr/Contents/Home" ]; then
            export JAVA_HOME="/Applications/Android Studio.app/Contents/jbr/Contents/Home"
          fi
          export PATH=$JAVA_HOME/bin:$PATH

          # 2. تنظيف الجذر
          rm -f /Users/builder/package.json /Users/builder/yarn.yml

          # 3. فك ضغط الأرشيف
          ZIP_NAME="coolvpn-hammad-pro-project-github-actions.zip"
          if [ -f "$ZIP_NAME" ]; then
            echo "Extracting $ZIP_NAME..."
            unzip -q "$ZIP_NAME"
          fi

          # 4. تحديد مجلد المشروع الأساسي
          PROJECT_DIR=$(find . -name "app.json" -not -path "*/node_modules/*" -not -path "*/api-server/*" -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="coolvpn-pro-project"
          fi

          cd "$PROJECT_DIR"
          echo "Working inside project directory: $(pwd)"

          # 5. تصحيح package.json
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            
            if (!pkg.dependencies) pkg.dependencies = {};
            if (!pkg.devDependencies) pkg.devDependencies = {};

            if (pkg.devDependencies) {
              for (const [k, v] of Object.entries(pkg.devDependencies)) {
                if (v === "catalog:" || (v && v.startsWith("workspace:"))) {
                  delete pkg.devDependencies[k];
                }
              }
            }
            if (pkg.dependencies) {
              for (const [k, v] of Object.entries(pkg.dependencies)) {
                if (v === "catalog:" || (v && v.startsWith("workspace:"))) {
                  delete pkg.dependencies[k];
                }
              }
            }

            pkg.dependencies["@tanstack/react-query"] = "latest";
            pkg.dependencies["zod"] = "latest";
            pkg.devDependencies["@react-native/metro-config"] = "latest";
            pkg.devDependencies["@react-native-community/cli"] = "latest";
            
            delete pkg.workspaces;
            delete pkg.packageManager;

            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
            console.log("package.json successfully updated.");
          '

          # 6. تنظيف الملفات المؤقتة
          rm -rf .expo node_modules yarn.lock .yarnrc.yml package-lock.json

          # 7. التثبيت عبر NPM
          npm install --legacy-peer-deps
          npm install @tanstack/react-query@latest zod@latest @react-native-community/cli@latest --legacy-peer-deps

          # 8. توليد هيكلة الأندرويد نظيفة
          npx expo prebuild --platform android --clean --no-install

          # 9. تجميع الـ JS Bundle مسبقاً يدوياً لمعرفة إذا كان هناك أي خطأ في الكود أو الـ Metro
          echo "Running manual bundle check..."
          npx react-native bundle --platform android --dev false --entry-file node_modules/expo-router/entry.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res || true

          # 10. الانتقال لـ android وبناء التطبيق مع طباعة معلومات الـ stacktrace في حال حدوث أي خطأ
          cd android
          echo "Current Android build path: $(pwd)"
          chmod +x gradlew

          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8" >> gradle.properties

          ./gradlew clean
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace --info
    artifacts:
      - "**/android/app/build/outputs/apk/release/*.apk"
      - "**/android/app/build/outputs/bundle/release/*.aab"
