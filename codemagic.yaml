workflows:
  android-release:
    name: Android Release Workflow
    instance_type: mac_mini_m2
    environment:
      groups:
        - android_credentials
      vars:
        PACKAGE_NAME: "com.coolvpn.pro"
      node: v22.14.0
    scripts:
      - name: Locate, Clean, Install via NPM and Build Android Release
        script: |
          set -e

          # 1. تنظيف أي مخلفات قديمة في الجذر
          rm -f /Users/builder/package.json /Users/builder/yarn.yml

          # 2. فك ضغط ملف المشروع إذا وجد
          ZIP_NAME="coolvpn-hammad-pro-project-github-actions.zip"
          if [ -f "$ZIP_NAME" ]; then
            echo "Extracting $ZIP_NAME..."
            unzip -q "$ZIP_NAME"
          fi

          # 3. العثور على مجلد المشروع الرئيسي الذي يحتوي على app.json
          PROJECT_DIR=$(find . -name "app.json" -not -path "*/node_modules/*" -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find . -name "android" -not -path "*/node_modules/*" -exec dirname {} \; | head -n 1)
          fi

          if [ -n "$PROJECT_DIR" ]; then
            echo "Located mobile project inside directory: $PROJECT_DIR"
            cd "$PROJECT_DIR"
          else
            echo "Error: Could not find mobile project directory!"
            exit 1
          fi

          echo "Current working directory: $(pwd)"

          # 4. تعديل package.json لتنظيفه تماماً من تبعات workspace و catalog المعقدة
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            
            // إزالة الـ catalog والمكتبات المحلية التابعة للـ workspace
            if (pkg.devDependencies) {
              for (const [k, v] of Object.entries(pkg.devDependencies)) {
                if (v === "catalog:" || (v && v.startsWith("workspace:"))) {
                  delete pkg.devDependencies[k];
                }
              }
            }
            if (pkg.dependencies) {
              for (const [k, v] of Object.entries(pkg.dependencies)) {
                if (v === "catalog:" || (v && v.startsWith("workspace:"))) {
                  delete pkg.dependencies[k];
                }
              }
            }

            // إضافة حزم التشغيل الأساسية لـ Expo والـ Metro
            pkg.devDependencies["@react-native/metro-config"] = "latest";
            delete pkg.workspaces;
            delete pkg.packageManager; // إلغاء ربط Yarn الإجباري

            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
            console.log("Successfully cleaned package.json for NPM");
          '

          # 5. حذف ملفات قفل Yarn القديمة بالكامل لضمان عدم حدوث تضارب
          rm -f yarn.lock .yarnrc.yml

          # 6. التثبيت باستخدام NPM (الخيار الأثبت والأسرع لمشاريع React Native في CI)
          npm install --legacy-peer-deps

          # 7. الانتقال لمجلد Android وبناء ملفات الـ APK و AAB النهائية
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease
    artifacts:
      - "**/android/app/build/outputs/apk/release/*.apk"
      - "**/android/app/build/outputs/bundle/release/*.aab"
