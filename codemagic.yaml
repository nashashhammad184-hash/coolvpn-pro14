workflows:
  android-release:
    name: Android Release Workflow
    instance_type: mac_mini_m2
    environment:
      groups:
        - android_credentials
      vars:
        PACKAGE_NAME: "com.coolvpn.pro"
      node: v22.14.0
    scripts:
      - name: Extract, Configure, Install and Build Android Release
        script: |
          set -e

          # 1. Isolate Yarn Berry workspace traversal from parent /Users/builder directory
          echo "{}" > /Users/builder/package.json
          echo "workspaces: []" > /Users/builder/yarn.yml

          # 2. Locate and extract the project zip package
          ZIP_NAME="coolvpn hammad pro project git.zip"
          if [ -f "$ZIP_NAME" ]; then
            echo "Extracting $ZIP_NAME..."
            unzip -q "$ZIP_NAME"
          else
            echo "Error: $ZIP_NAME not found!"
            exit 1
          fi

          # 3. Enter project directory and configure Yarn Berry (v4) explicitly
          cd coolvpn-pro-project
          corepack enable
          corepack prepare yarn@4.6.0 --activate
          yarn set version 4.6.0
          yarn --version

          # 4. Install dependencies using Yarn Berry
          yarn install

          # 5. Build Release APK and AAB bundles from the correct relative path
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease
    artifacts:
      - coolvpn-pro-project/android/app/build/outputs/apk/release/*.apk
      - coolvpn-pro-project/android/app/build/outputs/bundle/release/*.aab
