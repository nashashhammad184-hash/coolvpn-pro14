workflows:
  android-release:
    name: Android Release Workflow
    instance_type: mac_mini_m2
    environment:
      groups:
        - android_credentials
      vars:
        PACKAGE_NAME: "com.coolvpn.pro"
        NODE_OPTIONS: "--max-old-space-size=4096"
      node: v22.14.0
    scripts:
      - name: Robust Install, Manual Bundle and Android Build
        script: |
          set -e

          # 1. تنظيف الجذر
          rm -f /Users/builder/package.json /Users/builder/yarn.yml

          # 2. فك ضغط المشروع
          ZIP_NAME="coolvpn-hammad-pro-project-github-actions.zip"
          if [ -f "$ZIP_NAME" ]; then
            echo "Extracting $ZIP_NAME..."
            unzip -q "$ZIP_NAME"
          fi

          # 3. العثور على مجلد الموبايل الصحيح (متخطياً api-server)
          PROJECT_DIR=$(find . -name "app.json" -not -path "*/node_modules/*" -not -path "*/api-server/*" -exec dirname {} \; | head -n 1)
          
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find . -type d -name "android" -not -path "*/node_modules/*" -not -path "*/api-server/*" -exec dirname {} \; | head -n 1)
          fi

          if [ -n "$PROJECT_DIR" ]; then
            echo "Located Mobile Project inside directory: $PROJECT_DIR"
            cd "$PROJECT_DIR"
          else
            echo "Error: Could not find mobile project directory!"
            exit 1
          fi

          echo "Current working directory: $(pwd)"

          # 4. تنظيف package.json من الـ workspaces والـ catalogs
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            
            if (pkg.devDependencies) {
              for (const [k, v] of Object.entries(pkg.devDependencies)) {
                if (v === "catalog:" || (v && v.startsWith("workspace:"))) {
                  delete pkg.devDependencies[k];
                }
              }
            }
            if (pkg.dependencies) {
              for (const [k, v] of Object.entries(pkg.dependencies)) {
                if (v === "catalog:" || (v && v.startsWith("workspace:"))) {
                  delete pkg.dependencies[k];
                }
              }
            }

            pkg.devDependencies["@react-native/metro-config"] = "latest";
            delete pkg.workspaces;
            delete pkg.packageManager;

            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
            console.log("Successfully cleaned mobile package.json");
          '

          # 5. تنظيف قفل Yarn القديم
          rm -f yarn.lock .yarnrc.yml

          # 6. تثبيت الحزم عبر NPM
          npm install --legacy-peer-deps

          # 7. توليد هيكلة الأندرويد الأصلية نظيفة
          npx expo prebuild --platform android --clean --no-install

          # 8. الحل الجذري: بناء ملف الـ JavaScript Bundle يدوياً عبر العقدة لمنع فشل Gradle الداخلي
          echo "Building React Native JS bundle manually..."
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file node_modules/expo-router/entry.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

          # 9. الدخول لمجلد الأندرويد وتخطي مهام الـ bundle التلقائية أثناء تجميع Gradle
          cd android
          echo "Building from path: $(pwd)"
          chmod +x gradlew
          
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8" >> gradle.properties

          ./gradlew clean
          ./gradlew assembleRelease bundleRelease --no-daemon -x bundleReleaseJsAndAssets
    artifacts:
      - "**/android/app/build/outputs/apk/release/*.apk"
      - "**/android/app/build/outputs/bundle/release/*.aab"
