workflows:
  android-release:
    name: Android Release Workflow
    instance_type: mac_mini_m2
    environment:
      groups:
        - android_credentials
      vars:
        PACKAGE_NAME: "com.coolvpn.pro"
      node: v22.14.0
    scripts:
      - name: Locate, Configure, Install and Build Android Release
        script: |
          set -e

          # 1. Clean up any accidental package.json/yarn.yml created at home/builder root
          rm -f /Users/builder/package.json /Users/builder/yarn.yml

          # 2. Inspect the repository root contents
          echo "Repository root contents:"
          ls -la

          # 3. Extract the ZIP archive if present
          ZIP_NAME="coolvpn-hammad-pro-project-github-actions.zip"
          if [ -f "$ZIP_NAME" ]; then
            echo "Extracting $ZIP_NAME..."
            unzip -q "$ZIP_NAME"
          fi

          # 4. Find the mobile project directory containing app.json or the android folder (avoiding api-server)
          PROJECT_DIR=$(find . -name "app.json" -not -path "*/node_modules/*" -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find . -name "android" -not -path "*/node_modules/*" -exec dirname {} \; | head -n 1)
          fi

          if [ -n "$PROJECT_DIR" ]; then
            echo "Located mobile project inside directory: $PROJECT_DIR"
            cd "$PROJECT_DIR"
          else
            echo "Error: Could not find mobile project directory!"
            exit 1
          fi

          echo "Current working directory: $(pwd)"
          ls -la

          # 5. Fix Yarn Berry workspace isolation: create an empty yarn.lock in this standalone folder
          touch yarn.lock

          # 6. Enable Corepack & Setup Yarn Berry (v4)
          corepack enable
          corepack prepare yarn@4.6.0 --activate
          yarn set version 4.6.0
          yarn --version

          # 7. Install dependencies using Yarn Berry
          yarn install

          # 8. Build Release APK and AAB bundles
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease
    artifacts:
      - "**/android/app/build/outputs/apk/release/*.apk"
      - "**/android/app/build/outputs/bundle/release/*.aab"
