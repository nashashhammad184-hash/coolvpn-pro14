workflows:
  android-release:
    name: Android Release Workflow
    instance_type: mac_mini_m1
    environment:
      node: 20
    triggering:
      events:
        - push
    scripts:
      - name: Configure Root Workspace Isolator
        script: |
          # حيلة العزل البرمجي لمنع تعارض Yarn Berry الخارجي
          echo "{}" > /Users/builder/package.json
          touch /Users/builder/yarn.lock
      - name: Extract Project ZIP
        script: |
          ZIP_NAME="coolvpn hammad pro project git.zip"
          if [ -f "$ZIP_NAME" ]; then
            echo "Extracting $ZIP_NAME..."
            unzip -q "$ZIP_NAME"
          else
            echo "Error: $ZIP_NAME not found!"
            exit 1
          fi
      - name: Install dependencies
        script: |
          # الدخول للمجلد وتفعيل Yarn وتثبيت المكتبات في خطوة واحدة متصلة
          cd coolvpn-pro-project
          corepack enable
          yarn install
      - name: Build Android Release Bundle & APK
        script: |
          # الدخول المباشر لمجلد أندرويد وبناء التطبيق
          cd coolvpn-pro-project/android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease
    artifacts:
      - coolvpn-pro-project/android/app/build/outputs/apk/release/*.apk
      - coolvpn-pro-project/android/app/build/outputs/bundle/release/*.aab
