workflows:
  react-native-android:
    name: React Native Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: 20
    triggering:
      events:
        - push
    scripts:
      - name: Extract Project ZIP
        script: |
          unzip "*.zip"
          ls -la
      - name: Install dependencies
        script: |
          # العثور تلقائياً على المجلد المستخرج والدخول إليه
          TARGET_DIR=$(find . -maxdepth 1 -type d ! -name "." ! -name ".*" | head -n 1)
          cd "$TARGET_DIR"
          npm install
      - name: Build Android APK and AAB
        script: |
          # العثور تلقائياً على مجلد أندرويد بالداخل وبناء التطبيق
          TARGET_DIR=$(find . -maxdepth 1 -type d ! -name "." ! -name ".*" | head -n 1)
          cd "$TARGET_DIR/android" && ./gradlew assembleRelease bundleRelease
    artifacts:
      - "**/build/outputs/apk/release/*.apk"
      - "**/build/outputs/bundle/release/*.aab"
      
