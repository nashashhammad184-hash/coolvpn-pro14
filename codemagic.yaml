workflows:
  android-release:
    name: Android Release Workflow
    instance_type: mac_mini_m2
    environment:
      groups:
        - android_credentials
      vars:
        PACKAGE_NAME: "com.coolvpn.pro"
        NODE_OPTIONS: "--max-old-space-size=4096"
      node: v22.14.0
    scripts:
      - name: Audit, Configure Metro, Install, Prebuild and Build Android Release
        script: |
          set -e

          # 1. تنظيف بيئة الجذر
          rm -f /Users/builder/package.json /Users/builder/yarn.yml

          # 2. فك ضغط الأرشيف بدقة
          ZIP_NAME="coolvpn-hammad-pro-project-github-actions.zip"
          if [ -f "$ZIP_NAME" ]; then
            echo "Extracting $ZIP_NAME..."
            unzip -q "$ZIP_NAME"
          fi

          # 3. تحديد مجلد الموبايل الأساسي (coolvpn-pro-project) وتخطي api-server
          PROJECT_DIR=$(find . -name "app.json" -not -path "*/node_modules/*" -not -path "*/api-server/*" -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="coolvpn-pro-project"
          fi

          cd "$PROJECT_DIR"
          echo "Working inside project directory: $(pwd)"

          # 4. تنظيف package.json وتصحيح التبعيات المطلوبة
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            
            if (pkg.devDependencies) {
              for (const [k, v] of Object.entries(pkg.devDependencies)) {
                if (v === "catalog:" || (v && v.startsWith("workspace:"))) {
                  delete pkg.devDependencies[k];
                }
              }
            }
            if (pkg.dependencies) {
              for (const [k, v] of Object.entries(pkg.dependencies)) {
                if (v === "catalog:" || (v && v.startsWith("workspace:"))) {
                  delete pkg.dependencies[k];
                }
              }
            }

            pkg.devDependencies["@react-native/metro-config"] = "latest";
            delete pkg.workspaces;
            delete pkg.packageManager;

            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
            console.log("package.json audited and cleaned successfully.");
          '

          # 5. ضمان وجود ملف metro.config.js مستقر
          cat << 'EOF' > metro.config.js
          const { getDefaultConfig } = require('expo/metro-config');
          const config = getDefaultConfig(__dirname);
          module.exports = config;
          EOF

          # 6. حذف ملفات القفل القديمة والتثبيت النظيف عبر npm
          rm -f yarn.lock .yarnrc.yml
          npm install --legacy-peer-deps

          # 7. توليد مجلد android وملفات الـ Gradle بالكامل (بما فيها gradlew المفقود) عبر Expo Prebuild
          echo "Generating native android project structure and gradlew..."
          npx expo prebuild --platform android --clean --no-install

          # 8. الانتقال لمجلد الأندرويد المُتولّد حديثاً وبناء التطبيق
          cd android
          echo "Current Android build path: $(pwd)"
          chmod +x gradlew

          # حقن إعدادات الذاكرة
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8" >> gradle.properties

          ./gradlew clean
          ./gradlew assembleRelease bundleRelease --no-daemon
    artifacts:
      - "**/android/app/build/outputs/apk/release/*.apk"
      - "**/android/app/build/outputs/bundle/release/*.aab"
