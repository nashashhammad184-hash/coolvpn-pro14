workflows:
  android-release:
    name: Android Release Workflow
    instance_type: mac_mini_m2
    environment:
      groups:
        - android_credentials
      vars:
        PACKAGE_NAME: "com.coolvpn.pro"
      node: v22.14.0
    scripts:
      - name: Locate, Clean, Install via NPM and Build Android Release
        script: |
          set -e

          # 1. تنظيف أي مخلفات قديمة في الجذر
          rm -f /Users/builder/package.json /Users/builder/yarn.yml

          # 2. فك ضغط ملف المشروع إذا وجد
          ZIP_NAME="coolvpn-hammad-pro-project-github-actions.zip"
          if [ -f "$ZIP_NAME" ]; then
            echo "Extracting $ZIP_NAME..."
            unzip -q "$ZIP_NAME"
          fi

          # 3. العثور على مجلد المشروع الرئيسي الذي يحتوي على package.json
          PROJECT_DIR=$(find . -name "package.json" -not -path "*/node_modules/*" -exec dirname {} \; | head -n 1)

          if [ -n "$PROJECT_DIR" ]; then
            echo "Located project inside directory: $PROJECT_DIR"
            cd "$PROJECT_DIR"
          else
            echo "Error: Could not find project directory!"
            exit 1
          fi

          echo "Current working directory: $(pwd)"

          # 4. تعديل package.json لتنظيفه تماماً من تبعات workspace و catalog المعقدة
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            
            if (pkg.devDependencies) {
              for (const [k, v] of Object.entries(pkg.devDependencies)) {
                if (v === "catalog:" || (v && v.startsWith("workspace:"))) {
                  delete pkg.devDependencies[k];
                }
              }
            }
            if (pkg.dependencies) {
              for (const [k, v] of Object.entries(pkg.dependencies)) {
                if (v === "catalog:" || (v && v.startsWith("workspace:"))) {
                  delete pkg.dependencies[k];
                }
              }
            }

            pkg.devDependencies["@react-native/metro-config"] = "latest";
            delete pkg.workspaces;
            delete pkg.packageManager;

            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
            console.log("Successfully cleaned package.json for NPM");
          '

          # 5. حذف ملفات قفل Yarn القديمة
          rm -f yarn.lock .yarnrc.yml

          # 6. التثبيت باستخدام NPM
          npm install --legacy-peer-deps

          # 7. البحث بدقة عن مجلد android والانتقال إليه بغض النظر عن مكانه الحالي
          ANDROID_PATH=$(find . -name "gradlew" -maxdepth 3 -exec dirname {} \; | head -n 1)
          
          if [ -n "$ANDROID_PATH" ]; then
            echo "Found android/gradlew at: $ANDROID_PATH"
            cd "$ANDROID_PATH"
          elif [ -d "android" ]; then
            cd android
          else
            echo "Error: android directory or gradlew not found!"
            exit 1
          fi

          echo "Building from path: $(pwd)"
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease
    artifacts:
      - "**/android/app/build/outputs/apk/release/*.apk"
      - "**/android/app/build/outputs/bundle/release/*.aab"
