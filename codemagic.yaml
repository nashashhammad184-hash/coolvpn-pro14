workflows:
  android-release:
    name: Android Release Workflow
    instance_type: mac_mini_m2
    environment:
      groups:
        - android_credentials
      vars:
        PACKAGE_NAME: "com.coolvpn.pro"
      node: v22.14.0
    scripts:
      - name: Locate, Patch, Install and Build Android Release
        script: |
          set -e

          # 1. Clean up any accidental files at builder root
          rm -f /Users/builder/package.json /Users/builder/yarn.yml

          # 2. Extract ZIP archive if present
          ZIP_NAME="coolvpn-hammad-pro-project-github-actions.zip"
          if [ -f "$ZIP_NAME" ]; then
            echo "Extracting $ZIP_NAME..."
            unzip -q "$ZIP_NAME"
          fi

          # 3. Locate mobile project directory containing app.json
          PROJECT_DIR=$(find . -name "app.json" -not -path "*/node_modules/*" -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find . -name "android" -not -path "*/node_modules/*" -exec dirname {} \; | head -n 1)
          fi

          if [ -n "$PROJECT_DIR" ]; then
            echo "Located mobile project inside directory: $PROJECT_DIR"
            cd "$PROJECT_DIR"
          else
            echo "Error: Could not find mobile project directory!"
            exit 1
          fi

          echo "Current working directory: $(pwd)"

          # 4. Patch package.json to remove catalog:/workspace: protocols and missing peer dependencies
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            
            if (pkg.devDependencies) {
              for (const [k, v] of Object.entries(pkg.devDependencies)) {
                if (v === "catalog:") {
                  if (k === "@tanstack/react-query") pkg.devDependencies[k] = "^5.60.0";
                  else if (k === "zod") pkg.devDependencies[k] = "^3.24.0";
                  else pkg.devDependencies[k] = "latest";
                } else if (v && v.startsWith("workspace:")) {
                  delete pkg.devDependencies[k];
                }
              }
            }
            
            if (pkg.dependencies) {
              for (const [k, v] of Object.entries(pkg.dependencies)) {
                if (v === "catalog:") {
                  pkg.dependencies[k] = "latest";
                } else if (v && v.startsWith("workspace:")) {
                  delete pkg.dependencies[k];
                }
              }
            }

            pkg.devDependencies["@react-native/metro-config"] = "latest";
            delete pkg.workspaces;

            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
            console.log("Successfully patched package.json");
          '

          # 5. Initialize clean Yarn Berry config (using valid Yarn 4 settings only)
          rm -f yarn.lock .yarnrc.yml
          cat << 'EOF' > .yarnrc.yml
          nodeLinker: node-modules
          EOF

          corepack enable
          corepack prepare yarn@4.6.0 --activate
          yarn set version 4.6.0
          yarn --version

          # 6. Install dependencies and permit immutable lockfile bypass via command line flag
          yarn install --immutable=false

          # 7. Build Release APK and AAB bundles
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease
    artifacts:
      - "**/android/app/build/outputs/apk/release/*.apk"
      - "**/android/app/build/outputs/bundle/release/*.aab"
