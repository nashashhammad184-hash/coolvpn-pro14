workflows:
  react-native-android:
    name: React Native Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: 20
    triggering:
      events:
        - push
    scripts:
      - name: Extract Project ZIP
        script: |
          # فك ضغط محتويات الـ ZIP مباشرة في المجلد الحالي دون مجلد فرعي تداخلي
          unzip -j "*.zip" -d . || unzip "*.zip"
          
          # تأكيد وجود ملف الحزم في المجلد الرئيسي
          ls -la
      - name: Install dependencies
        script: |
          # تفعيل Yarn وتثبيت المكتبات مباشرة من الجذر
          corepack enable
          yarn install
      - name: Build Android APK and AAB
        script: |
          # الدخول لمجلد الأندرويد الرئيسي وبناء التطبيق
          cd android && ./gradlew assembleRelease bundleRelease
    artifacts:
      - "**/build/outputs/apk/release/*.apk"
      - "**/build/outputs/bundle/release/*.aab"
      
