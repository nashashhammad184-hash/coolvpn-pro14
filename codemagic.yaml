workflows:
  android-release:
    name: Android Release Workflow
    instance_type: mac_mini_m1
    environment:
      groups:
        - android_credentials
      vars:
        PACKAGE_NAME: "com.coolvpn.pro"
      node: v22.14.0
    scripts:
      - name: Extract, Configure, Install and Build Android Release
        script: |
          # 1. عزل بيئة العمل لمنع تعارض Yarn Berry الخارجي
          echo "{}" > /Users/builder/package.json
          echo "workspaces: []" > /Users/builder/yarn.yml

          # 2. البحث التلقائي عن ملف الـ ZIP وفك ضغطه لتفادي أخطاء المسافات
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found zip file: $ZIP_FILE. Extracting..."
            unzip -q "$ZIP_FILE"
          else
            echo "Error: No .zip file found in the repository root!"
            exit 1
          fi

          # 3. العثور التلقائي على المجلد الناتج والدخول إليه
          TARGET_DIR=$(find . -maxdepth 1 -type d ! -name "." ! -name ".*" | head -n 1)
          echo "Entering directory: $TARGET_DIR"
          cd "$TARGET_DIR"

          # 4. تفعيل Corepack لتشغيل Yarn Berry المخصص للمشروع
          corepack enable
          yarn --version

          # 5. تثبيت الحزم والمكتبات
          yarn install

          # 6. تجميع وبناء ملف الـ APK والـ AAB للأندرويد
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease
    artifacts:
      - "**/build/outputs/apk/release/*.apk"
      - "**/build/outputs/bundle/release/*.aab"
