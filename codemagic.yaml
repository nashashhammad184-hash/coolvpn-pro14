workflows:
  android-release:
    name: Android Release Workflow
    instance_type: mac_mini_m2
    environment:
      groups:
        - android_credentials
      vars:
        PACKAGE_NAME: "com.coolvpn.pro"
        NODE_OPTIONS: "--max-old-space-size=4096"
      node: v22.14.0
    scripts:
      - name: Locate, Clean, Install, Prebuild and Build Android Release
        script: |
          set -e

          # 1. تنظيف أي مخلفات قديمة في الجذر
          rm -f /Users/builder/package.json /Users/builder/yarn.yml

          # 2. فك ضغط ملف المشروع إذا وجد
          ZIP_NAME="coolvpn-hammad-pro-project-github-actions.zip"
          if [ -f "$ZIP_NAME" ]; then
            echo "Extracting $ZIP_NAME..."
            unzip -q "$ZIP_NAME"
          fi

          # 3. العثور حصرياً على مجلد الموبايل الذي يحتوي على app.json
          PROJECT_DIR=$(find . -name "app.json" -not -path "*/node_modules/*" -not -path "*/api-server/*" -exec dirname {} \; | head -n 1)
          
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find . -type d -name "android" -not -path "*/node_modules/*" -not -path "*/api-server/*" -exec dirname {} \; | head -n 1)
          fi

          if [ -n "$PROJECT_DIR" ]; then
            echo "Located Mobile Project inside directory: $PROJECT_DIR"
            cd "$PROJECT_DIR"
          else
            echo "Error: Could not find mobile project directory!"
            exit 1
          fi

          echo "Current working directory: $(pwd)"

          # 4. تعديل package.json لتنظيفه تماماً من تبعات workspace و catalog المعقدة
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            
            if (pkg.devDependencies) {
              for (const [k, v] of Object.entries(pkg.devDependencies)) {
                if (v === "catalog:" || (v && v.startsWith("workspace:"))) {
                  delete pkg.devDependencies[k];
                }
              }
            }
            if (pkg.dependencies) {
              for (const [k, v] of Object.entries(pkg.dependencies)) {
                if (v === "catalog:" || (v && v.startsWith("workspace:"))) {
                  delete pkg.dependencies[k];
                }
              }
            }

            pkg.devDependencies["@react-native/metro-config"] = "latest";
            delete pkg.workspaces;
            delete pkg.packageManager;

            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
            console.log("Successfully cleaned mobile package.json for NPM");
          '

          # 5. حذف ملفات قفل Yarn القديمة
          rm -f yarn.lock .yarnrc.yml

          # 6. التثبيت باستخدام NPM مع تمرير flags لتجنب أخطاء الإصدارات
          npm install --legacy-peer-deps

          # 7. التأكد من وجود مجلد android و ملف gradlew، وإذا لم يوجد يتم توليده عبر Expo Prebuild
          if [ ! -f "android/gradlew" ]; then
            echo "Gradle wrapper missing. Generating native android project via Expo Prebuild..."
            npx expo prebuild --platform android --no-install
          fi

          # 8. الدخول لمجلد android وبناء التطبيق مع زيادة ذاكرة Java و Node
          cd android
          echo "Building from path: $(pwd)"
          chmod +x gradlew
          
          # إضافة إعدادات الذاكرة مباشرة لملف gradle.properties لضمان عدم حدوث انهيار في الحزم
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8" >> gradle.properties

          ./gradlew assembleRelease bundleRelease --no-daemon
    artifacts:
      - "**/android/app/build/outputs/apk/release/*.apk"
      - "**/android/app/build/outputs/bundle/release/*.aab"
